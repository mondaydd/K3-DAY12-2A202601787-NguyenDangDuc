# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: agent + redis
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    build: .                        # build từ Dockerfile trong thư mục hiện tại
    ports:
      - "8000:8000"                 # map cổng: máy_thật:container
    depends_on:
      redis:
        condition: service_healthy  # đợi Redis healthy rồi mới start agent
    environment:
      # KHÔNG viết secret thẳng vào đây!
      # ${AGENT_API_KEY} → docker compose tự đọc từ file .env cùng thư mục
      AGENT_API_KEY: ${AGENT_API_KEY}
      # Trong compose, tên service (redis) chính là hostname
      # Không dùng localhost — localhost trong container là chính container đó
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s             # cho app thời gian khởi động trước khi check

volumes:
  redis-data:
